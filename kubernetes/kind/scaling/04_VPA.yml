
# ==========================================
# 1. Create Namespace
# ==========================================
apiVersion: v1
kind: Namespace
metadata:
  name: development

---
# ==========================================
# 2. Create Pod
# ==========================================
apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod
  namespace: development
  labels:
    app: nginx-pod
spec:
  containers:
    - name: nginx-container
      image: nginx:latest
      ports:
        - containerPort: 80
      resources:
        requests:
          cpu: 100m
          memory: 64Mi

---
# ==========================================
# 3. Create Service
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  namespace: development
spec:
  type: ClusterIP
  selector:
    app: nginx-pod
  ports:
    - port: 80
      targetPort: 80

---
# ==========================================
# 4. Create VPA
# ==========================================
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: nginx-vpa
  namespace: development
spec:
  targetRef:
    apiVersion: v1
    kind: Pod
    name: nginx-pod
  updatePolicy:
    updateMode: "Off"
