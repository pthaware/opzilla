########################################
# Create Namespace
########################################
apiVersion: v1
kind: Namespace
metadata:
  name: nginx-ns

---
########################################
# Create Persistent Volume Claim
########################################
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nginx-pvc
  namespace: nginx-ns
spec:
  accessModes:
    - ReadWriteOnce

  resources:
    requests:
      storage: 1Gi

  storageClassName: standard

---
########################################
# Create Pod
########################################
apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod
  namespace: nginx-ns
spec:
  containers:
    - name: nginx-container
      image: nginx:latest
      ports:
        - containerPort: 80

      volumeMounts:
        - name: nginx-volume
          mountPath: /usr/share/nginx/html

  volumes:
    - name: nginx-volume
      persistentVolumeClaim:
        claimName: nginx-pvc
