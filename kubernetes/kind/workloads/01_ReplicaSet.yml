# Create Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: nginx-ns

---

# Create ReplicaSet
apiVersion: apps/v1
kind: ReplicaSet

metadata:
  name: nginx-replicaset
  namespace: nginx-ns

spec:
  replicas: 3

  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx

    spec:
      containers:
        - name: nginx-container
          image: nginx:latest
          ports:
            - containerPort: 80
