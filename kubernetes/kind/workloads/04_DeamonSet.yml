# Create Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: nginx-ns

---

# Create DaemonSet
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nginx-daemonset
  namespace: nginx-ns
spec:
  selector:
    matchLabels:
      app: nginx-pod
    
  template:
    metadata:
      labels:
        app: nginx-pod
    
    spec:
      containers:
        - name: nginx-container
          image: nginx:latest
          ports:
            - containerPort: 80